{% macro render_field(field) %}
<div class="mb-3">
  <label class="form-label">{{ field.label.text }}</label>
  {{ field(class="form-control" + (" is-invalid" if field.errors else ""), **kwargs) | safe }}
  {% if field.errors %}
    <div class="mt-2">
      {% for error in field.errors %}
        <span class="badge bg-danger text-wrap p-2 w-100 text-start d-block mb-1">
          <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </span>
      {% endfor %}
    </div>
  {% endif %}
</div>
{% endmacro %}
